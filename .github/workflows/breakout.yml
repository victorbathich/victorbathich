# Gera a animação de Breakout a partir do gráfico de contribuições
# e publica os SVGs na branch "output" (o README e a main não são alterados).
name: Breakout animation

on:
  schedule:
    - cron: "17 4 * * *" # todo dia, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/breakout.yml

permissions: {}

concurrency:
  group: breakout
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # necessário apenas para gravar na branch output
    steps:
      - name: Gerar SVGs (claro e escuro)
        uses: cyprieng/github-breakout@60c43dca3a1361fbc9fb9bb533b5193296345c4f # v1.2.4
        with:
          github_username: ${{ github.repository_owner }}
          output_path: dist

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza breakout"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
