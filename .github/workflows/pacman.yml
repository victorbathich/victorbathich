# Gera o Pac-Man com tema de praia a partir do gráfico de contribuições
# e publica os SVGs na branch "output" (o README e a main não são alterados).
name: Pac-Man animation

on:
  schedule:
    - cron: "17 4 * * *" # todo dia, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pacman.yml
      - scripts/pacman.mjs

permissions: {}

concurrency:
  group: pacman
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # necessário apenas para gravar na branch output
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Instalar a biblioteca do Pac-Man (versão fixa)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund pacman-contribution-graph@5.5.2

      - name: Gerar SVGs com o tema de praia
        run: node scripts/pacman.mjs
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: dist

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: atualiza pac-man"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
