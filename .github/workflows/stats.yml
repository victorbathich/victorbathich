# Gera os cards de estatísticas (scripts/profile-stats.mjs)
# e publica os SVGs na branch "stats".
#
# Opcional: cadastre o secret PROFILE_STATS_TOKEN (token pessoal somente leitura)
# para incluir repositórios privados. Sem ele, o workflow usa o token padrão
# do Actions e os cards mostram apenas dados públicos.
name: Profile stats

on:
  schedule:
    - cron: "37 4 * * *" # todo dia, 04:37 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/profile-stats.mjs
      - .github/workflows/stats.yml

permissions: {}

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # necessário apenas para gravar na branch stats
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Gerar cards
        run: node scripts/profile-stats.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          GH_USER: ${{ github.repository_owner }}
          TOKEN_SCOPE: ${{ secrets.PROFILE_STATS_TOKEN != '' && 'personal' || 'public' }}
          OUT_DIR: dist

      - name: Publicar na branch stats
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: stats
          build_dir: dist
          commit_message: "chore: atualiza cards de estatísticas"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
